name: payments

# Start order: postgres and rabbitmq become healthy -> migrate runs to completion ->
# api, outbox-relay and webhook-mock start -> consumer starts once webhook-mock is healthy.

x-app: &app
  build: .
  image: payments-service:local
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://payments:payments@postgres:5432/payments
    RABBITMQ_URL: amqp://payments:payments@rabbitmq:5672/
    API_KEY: ${API_KEY:-dev-api-key}
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}

x-migrated: &migrated
  migrate:
    condition: service_completed_successfully

x-http-healthcheck: &http-healthcheck
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 5s

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    volumes:
      # PostgreSQL 18 images keep data in a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    # RabbitMQ stores data per node name, which derives from the hostname.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: payments
      RABBITMQ_DEFAULT_PASS: payments
    ports:
      - "15672:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      <<: *migrated
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]

  outbox-relay:
    <<: *app
    command: ["python", "-m", "payments.outbox"]
    depends_on:
      <<: *migrated
      rabbitmq:
        condition: service_healthy

  consumer:
    <<: *app
    command: ["python", "-m", "payments.consumer"]
    depends_on:
      <<: *migrated
      rabbitmq:
        condition: service_healthy
      webhook-mock:
        condition: service_healthy

  webhook-mock:
    <<: *app
    command: ["uvicorn", "payments.webhook_mock.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]

volumes:
  postgres-data:
  rabbitmq-data:
