[project]
name = "payments-service"
version = "0.1.0"
description = "Asynchronous payment processing service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.32",
    "fastapi>=0.143",
    "faststream[rabbit]>=0.7.7",
    "httpx>=0.28.1",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "testcontainers[postgres,rabbitmq]>=4.15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payments"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "DTZ",      # naive datetimes
    "T20",      # print
    "SIM",      # simplify
    "RET",      # return
    "PT",       # pytest style
    "ASYNC",    # async pitfalls
    "S",        # bandit
    "BLE",      # blind except
    "FBT",      # boolean positional args
    "PL",       # pylint
    "TRY",      # exception handling
    "PERF",     # performance
    "FURB",     # refurb
    "RUF",      # ruff-specific
]
ignore = [
    "PLR0913",  # FastAPI/FastStream handlers legitimately take many injected params
    "TRY003",   # short messages in exception constructors are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]
"migrations/**" = ["N999"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Security"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["payments", "tests"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs Docker; starts PostgreSQL and RabbitMQ via testcontainers",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["payments"]
branch = true
